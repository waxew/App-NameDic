name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Validate bundled data
        run: python3 tools/validate_data.py
      - name: Sync licensed name datasets
        run: python3 tools/sync_names.py
      - name: Apply v1.0.2 data-quality fix
        run: python3 tools/apply_data_quality_fix.py
      - name: Persist expanded dataset and data-quality fix
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/names_base.json \
            app/src/main/java/ir/asteam/namedic/data/NameRepository.kt \
            app/src/main/java/ir/asteam/namedic/ui/App.kt \
            app/build.gradle.kts VERSION.txt README.md PROJECT_INFO.md
          if ! git diff --cached --quiet; then
            git commit -m "Persist v1.0.2 name data-quality enhancements [skip ci]"
            git push origin HEAD:main
          fi
      - name: Validate expanded data
        run: python3 tools/validate_data.py
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-NameDic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
