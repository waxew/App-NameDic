name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate bundled name data
        run: python3 tools/validate_data.py

      - name: Validate historical figures data
        run: python3 tools/validate_history.py

      - name: Validate history timeline data
        run: python3 tools/validate_history_timeline.py

      - name: Snapshot current enriched corpus
        run: cp app/src/main/assets/names_base.json /tmp/names_base_previous.json

      - name: Merge licensed open name databases
        run: python3 tools/sync_names.py

      - name: Merge additional MIT Persian names corpus
        run: python3 tools/sync_mohammadhejazirad_names.py

      - name: Restore previous enrichment metadata
        run: python3 tools/restore_enriched_orphans.py /tmp/names_base_previous.json

      - name: Enrich Persian lexical homonyms from Dehkhoda
        run: python3 tools/sync_dehkhoda_lexical.py

      - name: Enrich language categories from Wikidata
        run: python3 tools/sync_wikidata_cultures.py

      - name: Enrich pronunciation and origins from Wiktionary
        run: python3 tools/sync_wiktionary_names.py

      - name: Build data coverage report
        run: python3 tools/build_data_report.py

      - name: Validate expanded name data
        run: python3 tools/validate_data.py

      - name: Persist multi-source corpus
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/names_base.json \
            app/src/main/assets/data_build_info.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist multi-source name corpus [skip ci]"
            git push origin HEAD:main
          fi

      - name: Apply v1.4 comparison UI migration
        run: python3 tools/apply_compare_ui_upgrade.py

      - name: Apply v1.5 history UI migration
        run: python3 tools/apply_history_ui_upgrade.py

      - name: Apply v2 completion UI migration
        run: python3 tools/apply_v2_completion_ui.py

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Persist validated v2 UI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ir/asteam/namedic/ui/NameDicRedesign.kt
          if ! git diff --cached --quiet; then
            git commit -m "Apply v2 completion UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Prepare v2 delivery bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/App-NameDic-v2.0.0-debug.apk
          sha256sum dist/App-NameDic-v2.0.0-debug.apk > dist/SHA256SUMS.txt
          git archive --format=zip --output=dist/App-NameDic-v2.0.0-source.zip HEAD
          cat > dist/BUILD_INFO.txt <<'EOF'
          App-NameDic / نام‌نامه ایران
          Version: 2.0.0
          Version code: 11
          Application ID: ir.asteam.namedic
          Build type: Debug APK for testing
          Validation: name data + historical figures + timeline + unit tests + lint + assembleDebug
          Release signing: private original keystore is intentionally not stored in this public repository or CI.
          EOF

      - name: Upload pull-request APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: App-NameDic-v2.0.0-pr-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload v2 delivery bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: App-NameDic-v2.0.0-delivery
          path: dist/*
