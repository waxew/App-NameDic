name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Validate bundled data
        run: python3 tools/validate_data.py

      - name: Snapshot current enriched corpus
        run: cp app/src/main/assets/names_base.json /tmp/names_base_previous.json

      - name: Merge licensed open name databases
        run: python3 tools/sync_names.py

      - name: Merge additional MIT Persian names corpus
        run: python3 tools/sync_mohammadhejazirad_names.py

      - name: Restore enrichment-only records
        run: python3 tools/restore_enriched_orphans.py /tmp/names_base_previous.json

      - name: Enrich language categories from Wikidata
        run: python3 tools/sync_wikidata_cultures.py

      - name: Enrich pronunciation and origins from Wiktionary
        run: python3 tools/sync_wiktionary_names.py

      - name: Build data coverage report
        run: python3 tools/build_data_report.py

      - name: Validate expanded data
        run: python3 tools/validate_data.py

      - name: Persist multi-source corpus
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/names_base.json \
            app/src/main/assets/data_build_info.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist multi-source name corpus [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: App-NameDic-debug
          path: app/build/outputs/apk/debug/app-debug.apk
